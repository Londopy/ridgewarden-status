# The internet mirror: a read-only copy of the mesh status page on a public web server.
# ridgewarden-status pushes static files into ./site (rsync over ssh, or an HTTP PUT to a
# WebDAV share that writes there). Caddy serves them through Anubis, which makes browsers
# solve a small proof-of-work first and keeps AI scrapers and bulk crawlers off.
# The mesh app itself is never exposed: this server only ever holds files.
services:
  caddy:
    # pinned by digest as well as tag, so the image can't change under the same name
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data

  anubis:
    # pinned so an upstream release can't change behavior under us; bump on purpose
    image: ghcr.io/techarohq/anubis:v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
    restart: unless-stopped
    env_file: .env # ED25519_PRIVATE_KEY_HEX lives here, untracked (see .env.example)
    environment:
      BIND: ":8923"
      # back to Caddy, whose second site serves the files and isn't published
      TARGET: "http://caddy:8080"
      DIFFICULTY: "4"
      # one pass works for every subdomain; no port here
      COOKIE_DOMAIN: "example.org"
      # after the challenge, send people back only to this site; unset allows any domain
      REDIRECT_DOMAINS: "status.example.org"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
      # robots.txt and link previews (chat apps) keep working
      SERVE_ROBOTS_TXT: "true"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
      # internal only, never published
      METRICS_BIND: ":9090"
    volumes:
      - "./botPolicy.yaml:/data/cfg/botPolicy.yaml:ro"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms

volumes:
  caddy-data:
